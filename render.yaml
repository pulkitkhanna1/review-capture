services:
  - type: web
    name: review-capture
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: PM_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
